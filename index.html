<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />

    <!-- Static defaults are Japanese (the initial language); js/main.js updates lang, title and description on toggle. -->
    <title>Susanoo | フルスタックエンジニア</title>
    <meta
      name="description"
      content="Susanoo — 企業サイト、ECサイト、業務システム、ブロックチェーンプロダクトの開発を手がける、経験12年のフルスタックエンジニア。フリーランス案件・協業のご相談を受け付けています。"
    />
    <meta
      name="keywords"
      content="Susanoo, フルスタックエンジニア, Full Stack Engineer, WordPress, Shopify, MakeShop, ecforce, BASE, Craft CMS, PHP, Python, Django, kintone, Solidity, Web3, ポートフォリオ, Portfolio"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Susanoo | フルスタックエンジニア" />
    <meta
      property="og:description"
      content="企業サイト、EC、業務システム、Web3にわたる12年の経験を持つフルスタックエンジニア。"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffffff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%230284c7' stroke-width='2'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for Latin text; Noto Sans JP fills in for Japanese glyphs Inter does not cover. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/main.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/"
        }
      }
    </script>
    <script src="./vendor/gsap/gsap.min.js" defer></script>
    <script src="./vendor/gsap/ScrollTrigger.min.js" defer></script>
  </head>

  <body>
    <!-- Loading screen -->
    <div id="loader">
      <div class="loader-word" id="loader-word">SUSANOO</div>
      <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
      <div class="loader-pct" id="loader-pct">0%</div>
    </div>

    <!-- Navigation -->
    <nav class="nav" aria-label="Primary">
      <div class="nav-inner">
        <a class="nav-logo" href="#hero">
          <span class="nav-logo-mark" id="nav-mark">HT</span>
          <span id="nav-name">Susanoo</span>
        </a>
        <div class="nav-links" id="nav-links"></div>
        <div class="nav-actions">
          <div class="lang-toggle" id="lang-toggle" role="group" aria-label="言語"></div>
          <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-controls="nav-drawer"></button>
        </div>
      </div>
    </nav>
    <div class="nav-drawer" id="nav-drawer" hidden></div>

    <!-- Hero -->
    <section class="hero" id="hero">
      <div id="hero-canvas"></div>
      <div class="hero-overlay">
        <div class="hero-role-slot">
          <h2 class="hero-role" id="hero-role">フルスタックエンジニア</h2>
        </div>
        <p class="hero-scroll" id="hero-scroll">スクロールして見る</p>
      </div>
    </section>

    <div class="social-rail" id="social-rail"></div>

    <!-- Everything below the fold is rendered from js/config.js -->
    <main id="sections"></main>

    <!-- Image lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
      <button class="lightbox-close" id="lightbox-close" aria-label="Close"></button>
      <img id="lightbox-img" alt="" />
    </div>

    <button class="back-to-top" id="back-to-top" aria-label="Back to top"></button>

    <noscript>
      <p style="padding: 120px 24px; text-align: center; color: #5c7188">
        このポートフォリオの表示にはJavaScriptを有効にする必要があります。<br />
        This portfolio needs JavaScript enabled to display its content.
      </p>
    </noscript>

    <!-- Failsafe: a plain script, so it still runs if a module fails to load.
         If the app has not started after 8s, offer a reload instead of an endless 0%. -->
    <script>
      setTimeout(function () {
        if (document.body.classList.contains('ready')) return;
        var pct = document.getElementById('loader-pct');
        if (!pct) return;
        // Mirror js/i18n.js: ?lang= wins, then the saved choice, then Japanese.
        var ja = true;
        try {
          var lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('portfolio:lang');
          if (lang) ja = lang === 'ja';
        } catch (e) {}
        pct.innerHTML =
          (ja ? '読み込みに時間がかかっています。' : 'Loading is taking longer than expected. ') +
          '<button type="button" class="loader-retry">' + (ja ? '再読み込み' : 'Reload') + '</button>';
        pct.querySelector('button').addEventListener('click', function () {
          location.reload();
        });
      }, 8000);
    </script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
